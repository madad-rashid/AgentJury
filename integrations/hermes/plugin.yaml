name: agentjury
version: 0.1.0
manifest_version: 2
api_version: 1
description: Peer-review substantial Hermes responses with blind AI reviewers (AgentJury).
author: madad-rashid
license: MIT
homepage: https://github.com/madad-rashid/AgentJury
tags: [review, evaluation, quality]
provides_hooks:
  - post_llm_call
  - post_tool_call
  - pre_llm_call
python_dependencies:
  - "agentjury @ git+https://github.com/madad-rashid/AgentJury.git@3023b96cadf7056076beb94e6dbbd9e3395858a8"
  - "openai>=1.55.3"
  - "anthropic>=1.11.0"
config_schema:
  panel:        {type: str,  default: "accuracy:openai,critic:anthropic,executive:openai", description: "role:provider[:model] entries; openai, anthropic, openrouter, ollama, compatible"}
  roles_file:   {type: str,  default: "", description: "JSON file of extra judge roles, e.g. a domain expert"}
  context_file: {type: str,  default: "", description: "Markdown file of organisational context given to every judge"}
  quorum:       {type: int,  default: 0,  description: "Minimum voters; 0 = strict majority"}
  min_chars:    {type: int,  default: 400, description: "Skip reviewing responses shorter than this"}
  task_type:    {type: str,  default: "", description: "Default task_type recorded on every verdict"}
  domain:       {type: str,  default: "", description: "Default domain recorded on every verdict"}
  frontmatter:  {type: bool, default: true, description: "Annotate complete, unchanged, current-generation markdown snapshots"}
  sidecar:      {type: bool, default: true, description: "Write <file>.agentjury.json for eligible reviewed snapshots"}
  feedback:     {type: bool, default: true, description: "Inject findings into the next turn when the verdict was not verified"}
