[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentjury"
version = "0.4.4"
description = "Peer review for AI agents using independent model juries and deterministic aggregation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rashid Al-Derham" },
]
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "llm",
    "llm-evaluation",
    "agent-evaluation",
    "multi-agent",
    "peer-review",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0"]

[project.scripts]
agentjury = "agentjury.cli:main"

[project.urls]
Homepage = "https://github.com/madad-rashid/AgentJury"
Repository = "https://github.com/madad-rashid/AgentJury"
Issues = "https://github.com/madad-rashid/AgentJury/issues"
Changelog = "https://github.com/madad-rashid/AgentJury/releases"

[tool.setuptools.packages.find]
include = ["agentjury*"]
