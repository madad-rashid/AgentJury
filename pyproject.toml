[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentjury"
version = "0.0.1"
description = "An open peer-review and reputation layer for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
agentjury = "agentjury.cli:main"

[tool.setuptools.packages.find]
include = ["agentjury*"]
